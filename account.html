<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d10"><title>ORANOS — My Account</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0d10;color:#f6f1e7;font-family:Inter,system-ui,sans-serif}main{width:min(560px,100%);padding:34px;border:1px solid #34363a;border-radius:20px;background:#17191e}h1{letter-spacing:.1em}p{color:#bbb6aa;line-height:1.6}.gold{color:#d6b36a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}a,button{padding:12px 16px;border-radius:9px;border:1px solid #555;background:#22252b;color:#eee;text-decoration:none;cursor:pointer}button.primary{background:#d6b36a;color:#111;border:0;font-weight:700}.status{color:#d6b36a}</style></head>
<body><main><div class="gold" style="font-size:12px;letter-spacing:.2em">ORANOS COMMUNITY</div><h1>MY ACCOUNT</h1><p id="status" class="status">Checking your session…</p><section id="details" hidden><p>Signed in as <strong id="email"></strong></p><p id="name"></p><div class="actions"><a href="community.html">Community</a><button id="logout" class="primary" type="button">Sign out</button></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://pbohqygrzesddmgmrfma.supabase.co","sb_publishable_OSKC6mR5O2iHPG1g63tyXA_wtd1y7oX",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
(async()=>{const {data,error}=await db.auth.getSession();if(error||!data.session){location.replace("auth.html");return;}const user=data.session.user;document.getElementById("email").textContent=user.email||"—";document.getElementById("name").textContent=user.user_metadata?.full_name||"Welcome to ORANOS.";document.getElementById("status").textContent="Your member session is active.";document.getElementById("details").hidden=false;})();
document.getElementById("logout").onclick=async()=>{const {error}=await db.auth.signOut();if(error){document.getElementById("status").textContent=error.message;return;}location.replace("auth.html");};
</script></body></html>
