<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>ORANOS — Strength is Earned. Legacy is Forged.</title>
  <meta name="description" content="ORANOS is a fitness, mindset, lifestyle and discipline community built around a shared standard.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main class="boot-screen">
      <div class="boot-mark">ORANOS</div>
      <div class="boot-line"></div>
      <p>Preparing your experience…</p>
    </main>
  </div>
  <script>
    (() => {
      const app = document.getElementById("app");
      const fail = () => {
        app.innerHTML = '<main class="boot-screen"><div><div class="boot-mark">ORANOS</div><h1>Something went wrong.</h1><p>We could not start the experience.</p><button class="btn primary" onclick="location.reload()">Try again</button></div></main>';
      };
      const loadApp = () => {
        const s=document.createElement("script");
        s.src="app.js";
        s.onerror=fail;
        document.body.appendChild(s);
      };
      const loadSdk = (urls,i=0) => {
        if(i>=urls.length)return fail();
        const s=document.createElement("script");
        s.src=urls[i];
        s.onload=()=>window.supabase?.createClient?loadApp():loadSdk(urls,i+1);
        s.onerror=()=>loadSdk(urls,i+1);
        document.head.appendChild(s);
      };
      loadSdk([
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
        "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"
      ]);
    })();
  </script>
</body>
</html>
